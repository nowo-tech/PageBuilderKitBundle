name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Superseded PR runs are cancelled. Push runs (main/master) get their own group (run_id), so a main run is never
# cancelled, not even while pending: tag_when_green.sh needs a completed run on every release commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Light mode (docs/GITHUB_CI.md#light-mode-for-deps-and-docs-only-prs): one representative cell plus the cheap
  # gates. The org (or repo) Actions variable NOWO_CI_PR_MODE picks the PR mode: light = every PR light; full = every
  # PR full; auto / unset = light only when the PR touches nothing but composer.json / composer.lock (root or demo),
  # docs/**, *.md, .github/ISSUE_TEMPLATE/**, specs/** or .cursor/**. push, tags, workflow_dispatch and schedule are
  # always full. Fail-closed: any error, unknown value or empty output means full (jobs reduce only on 'light').
  changes:
    name: Change scope (light or full)
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.classify.outputs.mode }}
    steps:
      - name: Checkout code (PR merge commit and its base parent)
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Classify the change
        id: classify
        env:
          EVENT: ${{ github.event_name }}
          SWITCH: ${{ vars.NOWO_CI_PR_MODE }}
          LIGHT: '^((demo/([^/]+/)?)?composer\.(json|lock)|docs/.*|specs/.*|\.cursor/.*|\.github/ISSUE_TEMPLATE/.*|.*\.md)$'
        run: |
          mode=full; paths=""
          if [ "$EVENT" != pull_request ]; then
            reason="event '$EVENT' always runs full"
          else
            case "$SWITCH" in
              light) mode=light; reason="NOWO_CI_PR_MODE=light: every PR is light" ;;
              full) reason="NOWO_CI_PR_MODE=full: every PR is full" ;;
              ''|auto)
                if files=$(git diff --name-only --no-renames HEAD^1 HEAD); then
                  mode=light; reason="NOWO_CI_PR_MODE=${SWITCH:-unset} (auto): only deps/docs paths changed"
                  while IFS= read -r f; do
                    [ -n "$f" ] || continue
                    if ! printf '%s\n' "$f" | grep -Eq "$LIGHT"; then mode=full; paths="$paths $f"; fi
                  done <<< "$files"
                  [ "$mode" = light ] || reason="NOWO_CI_PR_MODE=${SWITCH:-unset} (auto): non deps/docs paths changed:$paths"
                else
                  reason="NOWO_CI_PR_MODE=${SWITCH:-unset} (auto): git diff failed, fail-closed"
                fi ;;
              *) reason="NOWO_CI_PR_MODE='$SWITCH' is not light/auto/full, fail-closed" ;;
            esac
          fi
          echo "mode=$mode ($reason)"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          {
            echo "### CI mode: \`$mode\`"
            echo ""
            echo "$reason"
            if [ "$EVENT" = pull_request ] && [ -n "${files:-}" ]; then echo ""; echo "Changed paths:"; echo '```'; echo "$files" | head -200; echo '```'; fi
          } >> "$GITHUB_STEP_SUMMARY"

  git-hygiene:
    name: Git history (no Cursor co-author)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for Cursor co-author trailers (REQ-GIT-001)
        run: |
          chmod +x .scripts/check-no-cursor-coauthor.sh
          ./.scripts/check-no-cursor-coauthor.sh HEAD

  test:
    name: PHP ${{ matrix.php }} - Symfony ${{ matrix.symfony }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: changes
    # Never skip this job: a skipped matrix job reports its un-expanded name and the required contexts never appear.
    if: ${{ !cancelled() }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        php: ['8.4', '8.5']
        # Symfony 8.0 reached end of maintenance (July 2026): its CI cell is dropped (REQ-SF-002); composer.json still allows ^8.0.
        symfony: ['7.4', '8.1']
        exclude: []

    env:
      HEAVY: ${{ needs.changes.outputs.mode != 'light' || (matrix.php == '8.5' && matrix.symfony == '8.1') }}
    steps:
      - name: Light mode (deps/docs-only PR) - covered by PHP 8.5 - Symfony 8.1
        if: env.HEAVY != 'true'
        run: echo "Light mode, this cell has nothing to do."

      - name: Checkout code
        if: env.HEAVY == 'true'
        uses: actions/checkout@v7

      - name: Setup PHP
        if: env.HEAVY == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json
          coverage: pcov
          tools: composer:v2

      - name: Validate composer.json
        if: env.HEAVY == 'true'
        run: composer validate --strict

      - name: Get Composer cache directory
        if: env.HEAVY == 'true'
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        if: env.HEAVY == 'true'
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-${{ matrix.php }}-symfony-${{ matrix.symfony }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php }}-symfony-${{ matrix.symfony }}-composer-
            ${{ runner.os }}-php-${{ matrix.php }}-composer-

      - name: Override Composer platform PHP (composer.json pins the minimum PHP for the lock)
        if: env.HEAVY == 'true'
        run: composer config platform.php "${{ matrix.php }}.99"

      - name: Install dependencies with Symfony ${{ matrix.symfony }}
        if: env.HEAVY == 'true'
        run: |
          echo "📦 Installing dependencies for Symfony ${{ matrix.symfony }}..."
          composer require \
            symfony/framework-bundle:^${{ matrix.symfony }} \
            symfony/security-core:^${{ matrix.symfony }} \
            symfony/property-access:^${{ matrix.symfony }} \
            symfony/config:^${{ matrix.symfony }} \
            symfony/dependency-injection:^${{ matrix.symfony }} \
            symfony/http-kernel:^${{ matrix.symfony }} \
            doctrine/orm:^3.0 \
            doctrine/doctrine-bundle:^3.0 \
            --no-interaction --no-update
          composer require symfony/yaml:^${{ matrix.symfony }} --dev --no-interaction --no-update
          composer update --with-all-dependencies --no-interaction --prefer-dist --no-progress

      - name: Composer audit (Critical/High)
        if: env.HEAVY == 'true'
        run: composer audit --locked

      - name: Run tests
        if: env.HEAVY == 'true'
        run: |
          echo "🧪 Running tests on PHP ${{ matrix.php }} with Symfony ${{ matrix.symfony }}..."
          composer test
          if [ $? -ne 0 ]; then
            echo "❌ ERROR: Some tests failed"
            exit 1
          fi
          echo "✅ All tests passed successfully"

      - name: Validate coverage (PHP 8.4 with Symfony 7.4 only)
        if: env.HEAVY == 'true' && (matrix.php == '8.4' && matrix.symfony == '7.4')
        run: |
          echo "📊 Generating coverage report..."
          composer test-coverage

          if [ $? -ne 0 ]; then
            echo "❌ ERROR: Tests failed when generating coverage report"
            exit 1
          fi

          echo "✅ All tests passed, validating ≥99% coverage..."

          # Validate element coverage ≥99%
          php -r "
          if (!file_exists('coverage.xml')) {
              echo 'ERROR: coverage.xml file was not generated\n';
              exit(1);
          }

          \$coverage = simplexml_load_file('coverage.xml');
          if (\$coverage === false) {
              echo 'ERROR: Could not read coverage.xml\n';
              exit(1);
          }

          \$metrics = \$coverage->project->metrics;
          \$elements = (float)\$metrics['elements'];
          \$coveredElements = (float)\$metrics['coveredelements'];

          if (\$elements == 0) {
              echo 'No elements to cover\n';
              exit(0);
          }

          \$percentage = (\$coveredElements / \$elements) * 100;

          echo \"Coverage: \$coveredElements/\$elements (\$percentage%)\n\";

          if (\$percentage < 99) {
              echo \"ERROR: Coverage must be at least 99%. Current: \$percentage%\n\";
              exit(1);
          }

          echo \"✅ Coverage threshold confirmed (≥99%)\n\";
          "

  database:
    name: Real databases (MySQL 8.4, MariaDB 11.4, PostgreSQL 16) - DBAL ${{ matrix.dbal }}
    runs-on: ubuntu-latest
    needs: changes
    # Never skip this job: a skipped matrix job reports its un-expanded name and the required contexts never appear.
    if: ${{ !cancelled() }}

    services:
      mysql:
        image: ${{ needs.changes.outputs.mode != 'light' && 'mysql:8.4' || '' }}
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: pbk
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1" --health-interval=5s --health-timeout=5s --health-retries=30
      mariadb:
        image: ${{ needs.changes.outputs.mode != 'light' && 'mariadb:11.4' || '' }}
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: 'yes'
          MARIADB_DATABASE: pbk
        ports: ['3307:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=5s --health-retries=30
      postgres:
        image: ${{ needs.changes.outputs.mode != 'light' && 'postgres:16-alpine' || '' }}
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: pbk
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres" --health-interval=5s --health-timeout=5s --health-retries=30

    strategy:
      fail-fast: false
      matrix:
        dbal: ['3', '4']

    env:
      HEAVY: ${{ needs.changes.outputs.mode != 'light' }}
    steps:
      - name: Light mode (deps/docs-only PR) - no database run
        if: env.HEAVY != 'true'
        run: echo "Light mode, this cell has nothing to do."

      - name: Checkout code
        if: env.HEAVY == 'true'
        uses: actions/checkout@v7

      - name: Setup PHP
        if: env.HEAVY == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: json, pdo_mysql, pdo_pgsql
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        if: env.HEAVY == 'true'
        run: composer install --prefer-dist --no-progress --no-interaction

      # DoctrineBundle 3 requires DBAL 4: the DBAL 3 cell runs DoctrineBundle 2 (Symfony 7.4), whose ORM 3 proxies need
      # symfony/var-exporter 7 (LazyGhost) when native lazy objects are not enabled.
      - name: Use DBAL 3
        if: env.HEAVY == 'true' && matrix.dbal == '3'
        run: |
          composer require --no-update --no-interaction "doctrine/dbal:^3.8.2" "doctrine/doctrine-bundle:^2.13"
          composer require --no-update --no-interaction --dev "symfony/var-exporter:^7.4"
          composer update --with-all-dependencies --no-interaction --no-progress
          composer show | grep -E '^(doctrine/dbal|doctrine/doctrine-bundle|doctrine/orm|symfony/framework-bundle) '

      - name: Concurrency tests on real servers (REQ-RUNTIME-003; none may be skipped)
        if: env.HEAVY == 'true'
        timeout-minutes: 10
        env:
          PBK_MYSQL_URL: mysql://root@127.0.0.1:3306/pbk?serverVersion=8.4.0&charset=utf8mb4
          PBK_MARIADB_URL: mysql://root@127.0.0.1:3307/pbk?serverVersion=11.4.0-MariaDB&charset=utf8mb4
          PBK_POSTGRES_URL: pgsql://postgres@127.0.0.1:5432/pbk?serverVersion=16
        run: php -d memory_limit=1G vendor/bin/phpunit --group database --no-coverage --fail-on-skipped

  # Dependency floor: the code must work with the LOWEST nowo-tech/transaction-* versions composer.json allows (a host
  # can run `composer update nowo-tech/page-builder-kit-bundle` without updating them), and the demo lock must install
  # what the bundle requires (the demo installs from its lock, so a requirement added later is never installed).
  deps-floor:
    name: Dependency floor (nowo-tech/transaction-* lowest, demo lock)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Demo lock satisfies the bundle's nowo-tech requirements
        run: python3 .scripts/check-demo-lock.py . --only 'nowo-tech/*'

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Downgrade nowo-tech/transaction-* to the lowest allowed versions
        run: |
          composer update 'nowo-tech/transaction-*' --prefer-lowest --prefer-dist --no-progress --no-interaction
          composer show 'nowo-tech/transaction-*'

      - name: PHPStan at the floor
        run: composer phpstan

      - name: Unit and integration suites at the floor
        timeout-minutes: 15
        run: php -d memory_limit=1G vendor/bin/phpunit --no-coverage

  code-style:
    name: Code Style
    runs-on: ubuntu-latest
    # Only apply fixes automatically on push to main/master, not on PRs
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2, cs2pr

      - name: Install dependencies
        run: composer update --prefer-dist --no-progress --no-interaction

      - name: Fix code style
        run: composer cs-fix

      - name: Check for changes
        id: verify-changed-files
        run: |
          if [ -n "$(git status --porcelain -- '*.php')" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit changes
        if: steps.verify-changed-files.outputs.changed == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -u -- '*.php'
          git commit -m "Apply PHP CS Fixer fixes [skip ci]"
          git push

  code-style-check:
    name: Code Style Check
    runs-on: ubuntu-latest
    # On PRs only check, don't apply changes
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2, cs2pr

      - name: Install dependencies
        run: composer update --prefer-dist --no-progress --no-interaction

      - name: Check code style
        run: composer cs-check

  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest
    # On PRs only check, don't apply changes

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2, cs2pr

      - name: Install dependencies
        run: composer update --prefer-dist --no-progress --no-interaction

      - name: PHPStan (level and ignoreErrors from phpstan.neon.dist; fails the build on any error)
        run: composer phpstan --no-interaction

      # FrankenPHP worker-state audit (REQ-CS-008): shared services must not keep request state.
      - name: Igor (worker-state audit)
        run: composer igor

      # Twig coding standard (twig-cs-fixer, .twig-cs-fixer.php): fails on any lint error.
      - name: Twig lint
        run: composer twig:lint

  release-gates:
    name: Release gate (make ${{ matrix.gate }})
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() }}

    strategy:
      fail-fast: false
      matrix:
        gate: ['rector-dry', 'validate-phpdoc', 'validate-translations', 'check-twig-extra']

    env:
      HEAVY: ${{ needs.changes.outputs.mode != 'light' }}
      GATE: ${{ matrix.gate }}
    steps:
      - name: Light mode (deps/docs-only PR) - release gates run in full mode only
        if: env.HEAVY != 'true'
        run: echo "Light mode, this gate runs on full-mode PRs and on every push."

      - name: Checkout code
        if: env.HEAVY == 'true'
        uses: actions/checkout@v7

      - name: Is make ${{ matrix.gate }} defined in this repo?
        if: env.HEAVY == 'true'
        id: gate
        run: |
          # Defined = the Makefile has a rule with a recipe for the target. Skip only on these two exact make answers;
          # any other make error (broken Makefile, missing include) fails the cell instead of hiding the gate.
          run=false
          if [ ! -f Makefile ]; then
            reason="no Makefile in this repo"
          else
            set +e
            plan=$(LC_ALL=C make -n -o ensure-up -o install "$GATE" 2>&1)
            rc=$?
            set -e
            if [ "$rc" -ne 0 ] && printf '%s\n' "$plan" | grep -qF "No rule to make target '$GATE'.  Stop."; then
              reason="the Makefile has no '$GATE' target"
            elif [ "$rc" -eq 0 ] && printf '%s\n' "$plan" | grep -qF "Nothing to be done for '$GATE'."; then
              reason="the Makefile declares '$GATE' without a recipe"
            elif [ "$rc" -ne 0 ]; then
              printf '%s\n' "$plan"
              echo "::error title=Release gate $GATE::make -n $GATE failed (exit $rc), see the output above"
              exit 1
            else
              run=true
              echo "make $GATE runs (docker compose exec/run prefixes are dropped, the command runs on the runner):"
              printf '%s\n' "$plan"
            fi
          fi
          if [ "$run" = false ]; then
            echo "::notice title=Release gate $GATE skipped::$reason, nothing to check."
            echo "Release gate \`$GATE\` skipped: $reason." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - name: Setup PHP
        if: steps.gate.outputs.run == 'true'
        uses: shivammathur/setup-php@v2
        with:
          # same PHP as the phpstan job
          php-version: '8.4'
          tools: composer:v2

      - name: Get Composer cache directory
        if: steps.gate.outputs.run == 'true'
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        if: steps.gate.outputs.run == 'true'
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-8.4-release-gates-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-php-8.4-release-gates-composer-
            ${{ runner.os }}-php-8.4-composer-

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: make ${{ matrix.gate }}
        if: steps.gate.outputs.run == 'true'
        run: |
          # Stand-in for `docker compose`: `[global options] exec|run [options] <service> <command...>` runs <command>
          # here (-e VAR=value is exported, an absolute binary path missing on the runner is looked up on PATH). Any
          # other compose call (up, ps, ...) fails loudly: the gate needs a stack CI does not start.
          shim="$RUNNER_TEMP/compose-on-runner"
          cat > "$shim" <<'SHIM'
          #!/usr/bin/env bash
          set -euo pipefail
          sub=""
          while [ $# -gt 0 ]; do
            case "$1" in
              exec|run) sub=$1; shift; break ;;
              -f|--file|-p|--project-name|--project-directory|--env-file|--profile|--ansi|--progress) shift 2 ;;
              -*) shift ;;
              *) break ;;
            esac
          done
          if [ -z "$sub" ]; then echo "compose-on-runner: 'compose $*' needs the Docker stack, CI has none" >&2; exit 1; fi
          while [ $# -gt 0 ]; do
            case "$1" in
              -e|--env) export "$2"; shift 2 ;;
              --env=*) export "${1#--env=}"; shift ;;
              -w|--workdir|-u|--user|--name|--entrypoint|--index) shift 2 ;;
              -*) shift ;;
              *) shift; break ;;
            esac
          done
          if [ $# -eq 0 ]; then echo "compose-on-runner: no command after the service" >&2; exit 1; fi
          if [ "${1#/}" != "$1" ] && [ ! -x "$1" ]; then set -- "${1##*/}" "${@:2}"; fi
          exec "$@"
          SHIM
          chmod +x "$shim"
          make -o ensure-up -o install COMPOSE="$shim" COMPOSE_BIN="$shim" "$GATE"

  frontend:
    name: Frontend (Vitest + Vite build)
    runs-on: ubuntu-latest
    # Light mode: skipped (a skipped non-matrix job reports its own name with success for branch protection).
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.mode != 'light' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.14.2

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test with coverage (thresholds in vitest.config.ts)
        run: |
          set -o pipefail
          pnpm run test:coverage 2>&1 | tee coverage-ts.txt
          sh .scripts/ts-coverage-percent.sh coverage-ts.txt

      - name: Build assets
        run: pnpm build

      - name: Committed build is up to date
        run: git diff --exit-code -- src/Resources/public

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    # Light mode: skipped (a skipped non-matrix job reports its own name with success for branch protection).
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.mode != 'light' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: json
          coverage: pcov
          tools: composer:v2

      - name: Install dependencies
        run: composer update --prefer-dist --no-progress --no-interaction

      - name: Run tests with coverage
        run: |
          echo "🧪 Running tests with coverage..."
          composer test-coverage

          if [ $? -ne 0 ]; then
            echo "❌ ERROR: Tests failed"
            exit 1
          fi
          echo "✅ All tests passed successfully"

      - name: Validate ≥99% coverage
        run: |
          echo "📊 Validating ≥99% coverage..."

          # Validate element coverage ≥99%
          php -r "
          if (!file_exists('coverage.xml')) {
              echo 'ERROR: coverage.xml file was not generated\n';
              exit(1);
          }

          \$coverage = simplexml_load_file('coverage.xml');
          if (\$coverage === false) {
              echo 'ERROR: Could not read coverage.xml\n';
              exit(1);
          }

          \$metrics = \$coverage->project->metrics;
          \$elements = (float)\$metrics['elements'];
          \$coveredElements = (float)\$metrics['coveredelements'];

          if (\$elements == 0) {
              echo 'No elements to cover\n';
              exit(0);
          }

          \$percentage = (\$coveredElements / \$elements) * 100;

          echo \"Coverage: \$coveredElements/\$elements (\$percentage%)\n\";

          if (\$percentage < 99) {
              echo \"ERROR: Coverage must be at least 99%. Current: \$percentage%\n\";
              exit(1);
          }

          echo \"✅ Coverage threshold confirmed (≥99%)\n\";
          "

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          fail_ci_if_error: false

# Maintainer: Héctor Franco Aceituno (@HecFranco)
# Organization: nowo-tech (https://github.com/nowo-tech)
