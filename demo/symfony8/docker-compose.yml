name: page-builder-kit-bundle-demo-symfony-8

services:
  php:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: page-builder-kit-bundle-demo-symfony-8-php
    working_dir: /app
    ports:
      - "${PORT:-8137}:80"
    volumes:
      - .:/app
      - ../..:/var/page-builder-kit-bundle
      - ./docker/frankenphp/Caddyfile.dev:/etc/frankenphp/Caddyfile.dev
      - ./docker/entrypoint.sh:/usr/local/bin/docker-entrypoint.sh
      - ./docker/php-dev.ini:/usr/local/etc/php/conf.d/99-dev.ini:ro
      - composer-cache:/root/.composer/cache
    env_file:
      - .env
    environment:
      - COMPOSER_ALLOW_SUPERUSER=1
      - APP_ENV=dev
      - APP_DEBUG=1
      - APP_SECRET=${APP_SECRET:-demo-secret}
      - FRANKENPHP_MODE=${FRANKENPHP_MODE:-worker}
      - SERVER_NAME=:80
      - DATABASE_URL=mysql://${MYSQL_USER:-demo}:${MYSQL_PASSWORD:-demo}@mysql:3306/${MYSQL_DATABASE:-page_builder_kit_demo}?serverVersion=8.0.32&charset=utf8mb4
      - S3_ENDPOINT=${S3_ENDPOINT:-http://s3:9090}
      - S3_PUBLIC_BASE_URL=${S3_PUBLIC_BASE_URL:-http://localhost:9190/page-builder-kit}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-test}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-test}
      - S3_BUCKET=${S3_BUCKET:-page-builder-kit}
      - S3_REGION=${S3_REGION:-eu-central-1}
    # Public DNS for Composer / Packagist (Docker/WSL resolver failures)
    dns:
      - 8.8.8.8
      - 8.8.4.4
    depends_on:
      mysql:
        condition: service_healthy
      s3:
        condition: service_healthy
      s3-init:
        condition: service_completed_successfully
    networks:
      - page-builder-kit-demo-network

  mysql:
    image: mysql:8.0
    container_name: page-builder-kit-bundle-demo-symfony-8-mysql
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-page_builder_kit_demo}
      MYSQL_USER: ${MYSQL_USER:-demo}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-demo}
    volumes:
      - mysql-data:/var/lib/mysql
    # REQ-DEMO: database ports must not be published to the host
    networks:
      - page-builder-kit-demo-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible mock (Adobe S3Mock) for Grapes / content image uploads.
  s3:
    image: adobe/s3mock:latest
    container_name: page-builder-kit-bundle-demo-symfony-8-s3
    environment:
      initialBuckets: ${S3_BUCKET:-page-builder-kit}
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: "true"
    ports:
      - "${S3_API_PORT:-9190}:9090"
    volumes:
      - s3mock-data:/tmp/s3mockRoot
    networks:
      - page-builder-kit-demo-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9090/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  # Ensure the configured bucket exists (initialBuckets can race on first boot).
  # S3Mock returns 409 when the bucket already exists — treat that as success.
  s3-init:
    image: curlimages/curl:8.12.1
    container_name: page-builder-kit-bundle-demo-symfony-8-s3-init
    depends_on:
      s3:
        condition: service_healthy
    environment:
      S3_BUCKET: ${S3_BUCKET:-page-builder-kit}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        i=0
        while [ "$$i" -lt 30 ]; do
          code=$$(curl -s -o /dev/null -w '%{http_code}' -X PUT "http://s3:9090/$$S3_BUCKET" || echo 000)
          case "$$code" in
            200|201|204|409)
              echo "S3 bucket $$S3_BUCKET ready (HTTP $$code)."
              exit 0
              ;;
          esac
          i=$$((i + 1))
          sleep 1
        done
        echo "Failed to ensure S3 bucket $$S3_BUCKET" >&2
        exit 1
    networks:
      - page-builder-kit-demo-network
    restart: "no"

volumes:
  composer-cache:
  mysql-data:
  s3mock-data:

networks:
  page-builder-kit-demo-network:
    driver: bridge
