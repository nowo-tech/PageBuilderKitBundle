# REQ-DEMO-014: UiKit's default theme, unchanged, with UiKit's own semantic stylesheet only (no CSS framework, no CDN).
nowo_ui_kit:
    css_framework: custom
    # No icon font and no CDN: icon-only controls fall back to their text labels.
    icon_set: none
    row_actions_display: text
    layouts:
        admin: 'layouts/admin.html.twig'
